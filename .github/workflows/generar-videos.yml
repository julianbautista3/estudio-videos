name: Generar videos

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package.json', 'package-lock.json']
  workflow_dispatch:
    inputs:
      videos:
        description: 'Ids de los videos separados por espacio (vacío = todos)'
        required: false
        default: ''
      marca:
        description: 'Solo una marca (prodrivers, fruit-sante…). Vacío = todas'
        required: false
        default: ''

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Descargar navegador
        run: npx remotion browser ensure
      - name: Generar MP4
        env:
          VIDEOS: ${{ github.event.inputs.videos }}
          MARCA: ${{ github.event.inputs.marca }}
        run: |
          ARGS="$VIDEOS"
          if [ -n "$MARCA" ]; then ARGS="$ARGS --marca=$MARCA"; fi
          npm run render -- $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
          retention-days: 30
